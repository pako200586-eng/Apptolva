name: Asistente Gemini Móvil

on:
  issue_comment:
    types: 
      - created

jobs:
  procesar_con_gemini:
    if: ${{ contains(github.event.comment.body, '@gemini') }}
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      pull-requests: write
      contents: read
    
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Setup de entorno Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar SDK de Google
        run: npm install @google/generative-ai

      - name: Interacción directa con API y GitHub
        uses: actions/github-script@v9
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const { GoogleGenerativeAI } = require(`${process.env.GITHUB_WORKSPACE}/node_modules/@google/generative-ai`);
            
            const cuerpoComentario = context.payload.comment.body;
            const instruccion = cuerpoComentario.replace('@gemini', '').trim();
            
            if (!instruccion) return;

            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ 
              model: "gemini-3-flash-preview",
              generationConfig: {
                temperature: 0.2
              }
            });
            
            const systemContext = "Actúa como desarrollador Senior en PWAs, JavaScript y Firebase. Respuestas cortas, en formato Markdown y enfocadas en código directo sin introducciones.";
            const result = await model.generateContent(`${systemContext}\n\nConsulta: ${instruccion}`);
            const respuestaGemini = result.response.text();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚙️ **Respuesta de Gemini:**\n\n${respuestaGemini}`
            });
