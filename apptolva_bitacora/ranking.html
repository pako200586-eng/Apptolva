<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="./js/firebase-config.js"></script>
  <script src="./js/firebase-config-runtime.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ea580c">
  <title>Ranking Semanal | AppTolva</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="stylesheet" href="./css/fontawesome.min.css">
  <script src="./js/tailwindcss.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 pb-10">
  <header class="bg-orange-600 text-white p-4 sticky top-0 z-10 shadow flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <a href="index.html" aria-label="Volver al menú" class="text-white text-2xl">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div>
        <h1 class="font-black text-lg leading-tight">Ranking Semanal de Seguridad</h1>
        <p id="rankingSemanaSubtitulo" class="text-xs text-orange-100">Cargando semana...</p>
      </div>
    </div>
    <span id="badgeTopResumen" class="bg-white/20 text-white text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0">
      Top 5 · Últimos 3
    </span>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- Categoría Full vs Sencillo -->
    <div class="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm">
      <button id="tabFull" type="button" class="py-2 px-3 rounded-lg text-xs font-black bg-orange-600 text-white transition">
        <i class="fas fa-truck-moving mr-1"></i> Full (T3-S2-R4)
      </button>
      <button id="tabSencillo" type="button" class="py-2 px-3 rounded-lg text-xs font-black text-slate-600 hover:bg-slate-100 transition">
        <i class="fas fa-truck mr-1"></i> Sencillo (T3-S2)
      </button>
    </div>

    <!-- Filtro por Evento / Rubro -->
    <div id="filtrosEvento" class="flex gap-1.5 overflow-x-auto pb-1">
      <button type="button" data-filtro="general" class="filtro-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-slate-800 text-white">General</button>
      <button type="button" data-filtro="velocidad" class="filtro-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-white text-slate-600 border border-slate-200">Velocidad</button>
      <button type="button" data-filtro="samsara" class="filtro-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-white text-slate-600 border border-slate-200">Alertas</button>
      <button type="button" data-filtro="bitacoras" class="filtro-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-white text-slate-600 border border-slate-200">Bitácoras</button>
      <button type="button" data-filtro="checklists" class="filtro-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-white text-slate-600 border border-slate-200">Checklists</button>
    </div>

    <section id="miPosicionCard" class="bg-gradient-to-br from-slate-800 to-slate-900 text-white p-4 rounded-2xl shadow-md">
      <p class="text-xs text-slate-300 font-bold uppercase tracking-wider">Tu posición esta semana</p>
      <p class="text-sm text-slate-200 mt-1">Consultando tu calificación...</p>
    </section>

    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="bg-emerald-600 text-white px-4 py-2.5 flex items-center justify-between">
        <h2 id="tituloTop" class="font-black text-sm"><i class="fas fa-trophy mr-2"></i>Top 5 de la Semana</h2>
        <span id="subtituloTop" class="text-[11px] font-bold opacity-90">Mejores calificaciones</span>
      </div>
      <div id="listaTop" class="divide-y divide-slate-100"></div>
    </section>

    <section class="bg-white rounded-2xl border border-amber-200 shadow-sm overflow-hidden">
      <div class="bg-amber-600 text-white px-4 py-2.5 flex items-center justify-between">
        <h2 class="font-black text-sm"><i class="fas fa-exclamation-circle mr-2"></i>Área de Atención (Últimos 3)</h2>
        <span class="text-[11px] font-bold opacity-90">Oportunidad de mejora</span>
      </div>
      <div id="listaUltimos3" class="divide-y divide-amber-50"></div>
    </section>

    <p id="rankingEstado" class="text-center text-xs text-slate-400 font-medium"></p>
  </main>

  <script type="module">
    import {
      getFirebaseConfig, initializeApp, getAuth, onAuthStateChanged,
      initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
      doc, getDoc
    } from './js/firebase-sdk.js';
    import { leerPerfil } from './js/controlSesion.js';
    import { normalizarTexto, filtrarSegmentoPorEvento } from './js/rankingOperadores.js';

    const app = initializeApp(getFirebaseConfig());
    const auth = getAuth(app);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });

    const ETIQUETAS_FILTRO = {
      general: 'General',
      velocidad: 'Excesos de Velocidad',
      samsara: 'Alertas en Cabina',
      bitacoras: 'Bitácoras NOM-087',
      checklists: 'Checklists Preoperativos'
    };

    let rankingData = null;
    let categoriaActiva = 'full';
    let filtroEvento = 'general';
    let miNoEmpleado = null;
    let miNombrePerfil = null;

    const tabFull = document.getElementById('tabFull');
    const tabSencillo = document.getElementById('tabSencillo');
    const filtroBtns = Array.from(document.querySelectorAll('.filtro-btn'));
    const subtitulo = document.getElementById('rankingSemanaSubtitulo');
    const badgeTopResumen = document.getElementById('badgeTopResumen');
    const tituloTop = document.getElementById('tituloTop');
    const subtituloTop = document.getElementById('subtituloTop');
    const miCard = document.getElementById('miPosicionCard');
    const listaTop = document.getElementById('listaTop');
    const listaUltimos3 = document.getElementById('listaUltimos3');
    const estadoEl = document.getElementById('rankingEstado');

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function buscarMiRegistro(posiciones = []) {
      if (miNoEmpleado) {
        const porNum = posiciones.find((p) => String(p.noEmpleado) === String(miNoEmpleado));
        if (porNum) return porNum;
      }
      if (miNombrePerfil) {
        const normPerfil = normalizarTexto(miNombrePerfil);
        if (normPerfil) {
          const porNombre = posiciones.find((p) => normalizarTexto(p.nombre) === normPerfil);
          if (porNombre) return porNombre;
        }
      }
      return null;
    }

    function actualizarControles() {
      const activo = 'py-2 px-3 rounded-lg text-xs font-black bg-orange-600 text-white transition';
      const inactivo = 'py-2 px-3 rounded-lg text-xs font-black text-slate-600 hover:bg-slate-100 transition';
      tabFull.className = categoriaActiva === 'full' ? activo : inactivo;
      tabSencillo.className = categoriaActiva === 'sencillo' ? activo : inactivo;

      for (const btn of filtroBtns) {
        const esActivo = btn.dataset.filtro === filtroEvento;
        btn.className = esActivo
          ? 'filtro-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-slate-800 text-white'
          : 'filtro-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-bold bg-white text-slate-600 border border-slate-200';
      }
    }

    function detallePorFiltro(op) {
      const m = op.metricas || {};
      const r = op.rubros || {};
      if (filtroEvento === 'velocidad') {
        const ev = m.excesosVelocidad ?? 0;
        return {
          detalle: `${ev} ${ev === 1 ? 'exceso' : 'excesos'} de velocidad`,
          valorDerecha: `${r.velocidad ?? 0} pts`
        };
      }
      if (filtroEvento === 'samsara') {
        const al = m.alertasAplican ?? 0;
        return {
          detalle: `${al} ${al === 1 ? 'alerta aplicada' : 'alertas aplicadas'}`,
          valorDerecha: `${r.samsara ?? 0} pts`
        };
      }
      if (filtroEvento === 'bitacoras') {
        return {
          detalle: `${m.bitacoras ?? 0} de ${m.metaBitacoras ?? '-'} bitácoras NOM-087`,
          valorDerecha: `${r.bitacoras ?? 0} pts`
        };
      }
      if (filtroEvento === 'checklists') {
        const ch = m.checklists ?? 0;
        return {
          detalle: `${ch} ${ch === 1 ? 'checklist entregado' : 'checklists entregados'}`,
          valorDerecha: `${r.checklists ?? 0} pts`
        };
      }
      const velTxt = r.velocidad !== undefined ? ` · Vel: ${r.velocidad} (${m.excesosVelocidad ?? 0} ev)` : '';
      return {
        detalle: `Alertas: ${r.samsara ?? 0} (${m.alertasAplican ?? 0} ev)${velTxt} · Bit: ${r.bitacoras ?? 0} · Check: ${r.checklists ?? 0}`,
        valorDerecha: String(op.total)
      };
    }

    function crearFila(op, tipo, miRegistro) {
      const esMio = miRegistro && String(op.noEmpleado) === String(miRegistro.noEmpleado);
      const badgeColor = tipo === 'top'
        ? (op.posicion === 1 ? 'bg-amber-400 text-slate-900' : 'bg-emerald-100 text-emerald-800')
        : 'bg-amber-100 text-amber-900';

      const { detalle, valorDerecha } = detallePorFiltro(op);

      const fila = el('div', `p-3.5 flex items-center justify-between gap-3 ${esMio ? 'bg-orange-50' : ''}`);
      const izq = el('div', 'flex items-center gap-3 min-w-0');
      izq.appendChild(el('span', `w-8 h-8 rounded-full flex items-center justify-center font-black text-xs shrink-0 ${badgeColor}`, `#${op.posicion}`));

      const info = el('div', 'min-w-0');
      info.appendChild(el('p', 'font-bold text-sm text-slate-800 truncate', op.nombre));
      info.appendChild(el('p', 'text-[11px] text-slate-500', detalle));
      izq.appendChild(info);

      fila.appendChild(izq);
      fila.appendChild(el('span', 'font-black text-base text-slate-900 shrink-0', valorDerecha));
      return fila;
    }

    function renderMiTarjeta(miRegistro, totalOperadores) {
      if (!miRegistro) {
        miCard.replaceChildren(
          el('p', 'text-xs text-slate-300 font-bold uppercase tracking-wider', 'Tu posición esta semana'),
          el('p', 'text-sm text-slate-200 mt-1', 'Sin registro en esta categoría para la semana seleccionada.')
        );
        return;
      }

      const pesos = rankingData.pesos || {};
      const m = miRegistro.metricas || {};
      const topRow = el('div', 'flex items-center justify-between');
      const left = el('div');
      left.appendChild(el('p', 'text-[11px] text-orange-300 font-bold uppercase tracking-wider', `Tu posición · ${ETIQUETAS_FILTRO[filtroEvento]} (${miRegistro.esquemaEtiqueta})`));
      const h2 = el('h2', 'text-xl font-black mt-0.5', `#${miRegistro.posicion} `);
      h2.appendChild(el('span', 'text-sm font-normal text-slate-300', `de ${totalOperadores}`));
      left.appendChild(h2);
      left.appendChild(el('p', 'text-xs text-slate-300 mt-0.5', miRegistro.nombre));

      const right = el('div', 'text-right');
      const { valorDerecha } = detallePorFiltro(miRegistro);
      right.appendChild(el('span', 'text-2xl font-black text-orange-400', valorDerecha));
      right.appendChild(el('span', 'block text-[10px] text-slate-400', filtroEvento === 'general' ? 'de 100 pts' : ETIQUETAS_FILTRO[filtroEvento]));
      topRow.append(left, right);

      const tieneVel = miRegistro.rubros?.velocidad !== undefined;
      const grid = el('div', `grid ${tieneVel ? 'grid-cols-4' : 'grid-cols-3'} gap-2 mt-3 pt-3 border-t border-white/10 text-center text-xs`);
      const items = [
        ['Alertas', `${miRegistro.rubros.samsara}/${pesos.samsara ?? 20}`, `${m.alertasAplican ?? 0} ev`],
        ...(tieneVel ? [['Velocidad', `${miRegistro.rubros.velocidad}/${pesos.velocidad ?? 20}`, `${m.excesosVelocidad ?? 0} ev`]] : []),
        ['Bitácora', `${miRegistro.rubros.bitacoras}/${pesos.bitacoras ?? 35}`, `${m.bitacoras ?? 0}/${m.metaBitacoras ?? '-'}`],
        ['Checklist', `${miRegistro.rubros.checklists}/${pesos.checklists ?? 25}`, `${m.checklists ?? 0} reg`]
      ];
      for (const [label, val, sub] of items) {
        const cell = el('div');
        cell.appendChild(el('span', 'block text-slate-400 text-[10px]', label));
        cell.appendChild(el('strong', 'block', val));
        cell.appendChild(el('span', 'block text-slate-400 text-[10px]', sub));
        grid.appendChild(cell);
      }

      miCard.replaceChildren(topRow, grid);
    }

    function renderVista() {
      actualizarControles();
      if (!rankingData) return;

      const segBase = rankingData[categoriaActiva] || { totalOperadores: 0, topLimit: 5, top5: [], ultimos3: [], posiciones: [] };
      const seg = filtrarSegmentoPorEvento(segBase, filtroEvento);
      const topN = seg.topLimit || (seg.totalOperadores <= 8 ? 3 : 5);
      badgeTopResumen.textContent = `Top ${topN} · Últimos 3`;
      tituloTop.replaceChildren(el('i', 'fas fa-trophy mr-2'), document.createTextNode(`Top ${topN} · ${ETIQUETAS_FILTRO[filtroEvento]}`));
      subtituloTop.textContent = filtroEvento === 'general' ? 'Mejores calificaciones' : 'Menor incidencia / mayor cumplimiento';

      const miRegistro = buscarMiRegistro(seg.posiciones || []);
      renderMiTarjeta(miRegistro, seg.totalOperadores);

      const topNodes = seg.top5?.length
        ? seg.top5.map((op) => crearFila(op, 'top', miRegistro))
        : [el('p', 'p-4 text-xs text-slate-400 text-center', 'Sin datos publicados aún.')];
      listaTop.replaceChildren(...topNodes);

      const ultimosNodes = seg.ultimos3?.length
        ? seg.ultimos3.map((op) => crearFila(op, 'bottom', miRegistro))
        : [el('p', 'p-4 text-xs text-slate-400 text-center', 'Sin registros suficientes para mostrar últimos 3.')];
      listaUltimos3.replaceChildren(...ultimosNodes);
    }

    tabFull.addEventListener('click', () => { categoriaActiva = 'full'; renderVista(); });
    tabSencillo.addEventListener('click', () => { categoriaActiva = 'sencillo'; renderVista(); });
    for (const btn of filtroBtns) {
      btn.addEventListener('click', () => {
        filtroEvento = btn.dataset.filtro || 'general';
        renderVista();
      });
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      const perfil = leerPerfil(localStorage);
      miNoEmpleado = perfil?.noEmpleado || (user.email && user.email.endsWith('@apptolva.com') ? user.email.split('@')[0] : null);
      miNombrePerfil = perfil?.nombre || user.displayName || null;

      try {
        const snap = await getDoc(doc(db, 'ranking_semanal', 'actual'));
        if (!snap.exists()) {
          subtitulo.textContent = 'Sin corte semanal publicado';
          estadoEl.textContent = 'Aún no hay un ranking publicado.';
          return;
        }
        rankingData = snap.data();
        subtitulo.textContent = rankingData.etiquetaSemana || rankingData.semanaId || 'Semana actual';

        if (buscarMiRegistro(rankingData.sencillo?.posiciones || [])) {
          categoriaActiva = 'sencillo';
        }
        renderVista();
        estadoEl.textContent = `Actualizado: ${rankingData.publicadoEn ? new Date(rankingData.publicadoEn).toLocaleDateString('es-MX') : 'reciente'}`;
      } catch (err) {
        console.error('Error cargando ranking:', err);
        estadoEl.textContent = 'Sin conexión y sin caché previo del ranking.';
      }
    });
  </script>
</body>
</html>
