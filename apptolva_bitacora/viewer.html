<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#F28B00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="AppTolva">
    <title>AppTolva | Vista PDF</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <script src="./js/jspdf.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; min-height: 100vh; }
        header {
            background: linear-gradient(135deg, #d97000, #F28B00);
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        header h1 { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }
        header p { font-size: 10px; opacity: 0.9; margin-top: 2px; }
        #status-box {
            margin: 24px 16px;
            background: #fff;
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 4px solid #FFF0DB;
            border-top-color: #F28B00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status-title { font-size: 16px; font-weight: 700; color: #1f2937; margin-bottom: 6px; }
        #status-msg { font-size: 13px; color: #6b7280; }
        #error-icon { font-size: 40px; margin-bottom: 12px; }
        #download-btn {
            display: none;
            width: 100%;
            max-width: 320px;
            margin: 16px auto 0;
            padding: 14px;
            background: #F28B00;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(242,139,0,0.3);
        }
        #download-btn:active { opacity: 0.85; }
        #pdf-frame {
            display: none;
            width: 100%;
            height: calc(100vh - 160px);
            border: none;
            border-top: 2px solid #F28B00;
        }
        #viewer-info {
            display: none;
            padding: 10px 16px;
            background: #FFF0DB;
            border-bottom: 1px solid #f28b0033;
            font-size: 11px;
            color: #92400e;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 id="viewer-heading">📋 AppTolva</h1>
            <p>GRUPO BACHOCO, S.A. DE C.V. · Exhibición Electrónica Oficial · Av. Tecnológico 401, Celaya, Gto.</p>
        </div>
    </header>

    <div id="viewer-info">
        <strong>Vista Oficial de Exhibición Digital</strong> — Cumplimiento NOM-087-SCT-2-2017.
    </div>

    <div id="status-box">
        <div class="spinner" id="spinner"></div>
        <div id="status-title">Cargando reporte…</div>
        <div id="status-msg">Obteniendo datos del servidor, por favor espera.</div>
        <button id="download-btn" onclick="descargarPDF()">⬇️ Descargar PDF</button>
    </div>

    <iframe id="pdf-frame" title="Reporte PDF"></iframe>

    <script>
        const SHIFT_START_HOUR = 8;
        let pdfDoc = null;

        function setStatus(title, msg, isError) {
            document.getElementById('spinner').style.display = isError ? 'none' : 'block';
            document.getElementById('status-title').textContent = title;
            document.getElementById('status-msg').textContent = msg;
        }

        function showError(msg) {
            const box = document.getElementById('status-box');
            box.style.display = 'block';
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status-title').textContent = '❌ Error';
            document.getElementById('status-title').style.color = '#dc2626';
            document.getElementById('status-msg').textContent = msg;
        }

        function detectarTipo(data) {
            const t = String(data.reportType || data.tipo || data.report_type || '').toLowerCase();
            if (/(check|revis|inspec)/.test(t)) return 'checklist';
            if (/(bitac|hora|nom)/.test(t)) return 'bitacora';
            if (Array.isArray(data.checklistData) || Array.isArray(data.checklist)) return 'checklist';
            if (Array.isArray(data.logs)) return 'bitacora';
            return 'bitacora';
        }

        function formatGps(gps) {
            if (!gps || typeof gps.lat !== "number" || typeof gps.lng !== "number") return "GPS no capturado";
            const precision = typeof gps.accuracy === "number" ? ` ±${Math.round(gps.accuracy)}m` : "";
            return `${gps.lat.toFixed(6)}, ${gps.lng.toFixed(6)}${precision}`;
        }

        function getActivityStatus(log) {
            const rawStatus = log?.status ?? log?.estado ?? log?.activity ?? log?.actividad;
            if (typeof rawStatus === "number" && Number.isInteger(rawStatus) && rawStatus >= 1 && rawStatus <= 5) {
                return rawStatus;
            }

            const value = String(rawStatus ?? "").trim();
            if (/^[1-5]$/.test(value)) return Number(value);

            const normalized = value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            if (/PAUSA|BREAK|COMIDA|DESCANSO CORTO/.test(normalized)) return 2;
            if (/DESCANSO|REST/.test(normalized)) return 1;
            if (/MANEJ|CONDUC|EN RUTA|DRIVING/.test(normalized)) return 3;
            if (/AUXILIAR|SERVICIO|CARGA|DESCARGA|SERVICE/.test(normalized)) return 4;
            if (/EXCEPCION|EMERGENCIA|EXCEPTION/.test(normalized)) return 5;
            return null;
        }

        // Función auxiliar para añadir firmas asegurando compatibilidad JPEG/PNG
        function insertarFirmaSegura(doc, imgData, x, y, w, h) {
            if (!imgData || typeof imgData !== 'string' || !imgData.startsWith('data:image/')) return;
            try {
                const formato = imgData.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG';
                doc.addImage(imgData, formato, x, y, w, h);
            } catch (e) {
                console.warn("No se pudo estampar firma en PDF:", e);
            }
        }

        // ===================================================================
        //  BITÁCORA DE HORAS DE SERVICIO (NOM-087)
        // ===================================================================
        function generarPDFBitacora(data) {
            if (!window.jspdf) { showError("Librería PDF no disponible."); return null; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const naranja = [242, 139, 0];
            const azulOficial = [0, 51, 153];

            const folio = data.folio || "SF";
            const logs = Array.isArray(data.logs) ? data.logs : [];
            const shiftStart = data.shiftStartHour !== undefined ? data.shiftStartHour : SHIFT_START_HOUR;
            const fecha = data.fecha || new Date().toLocaleDateString();

            // Corte de 24 / 48 horas
            const startTrip = logs.length > 0 ? logs[0].startTime : new Date().getTime();
            const limit24Date = new Date(startTrip);
            limit24Date.setHours(shiftStart, 0, 0, 0);
            if (limit24Date.getTime() <= startTrip) {
                limit24Date.setDate(limit24Date.getDate() + 1);
            }
            const limit24 = limit24Date.getTime();

            const logsD1 = logs.filter(l => l.startTime < limit24);
            const logsD2 = logs.filter(l => l.startTime >= limit24 || (l.endTime && l.endTime > limit24));

            // Encabezado
            doc.setFillColor(...naranja); doc.rect(0, 0, 210, 22, 'F');
            doc.setTextColor(255); doc.setFontSize(13); doc.setFont("helvetica", "bold");
            doc.text("BITÁCORA DE HORAS DE SERVICIO", 105, 10, { align: "center" });
            doc.setFontSize(7); doc.setFont("helvetica", "normal");
            doc.text("NOM-087-SCT-2-2017 | Tiempos de Conducción y Pausas en Autotransporte Federal", 105, 16, { align: "center" });
            doc.setFontSize(8); doc.setTextColor(0);

            let y = 26;

            const row = (lbl, val, x, w) => {
                doc.setDrawColor(200); doc.setFillColor(245); doc.rect(x, y, w, 6.5, 'FD');
                doc.setFont("helvetica", "bold"); doc.text(lbl, x + 2, y + 4.2);
                doc.setFont("helvetica", "normal"); doc.text(String(val || ""), x + w - 2, y + 4.2, { align: "right" });
            };

            doc.setFontSize(7);
            // Razón social corregida
            doc.setFont("helvetica", "bold"); doc.text("PERMISIONARIO: GRUPO BACHOCO, S.A. DE C.V. — RFC: GBA940707AH4", 14, y);
            y += 4;
            doc.setFont("helvetica", "normal"); doc.text("Domicilio Fiscal: Av. Tecnológico 401, Celaya, Gto. CP 38010", 14, y);
            y += 5;
            
            row("FOLIO:", folio, 14, 35);
            row("FECHA EMISIÓN:", fecha, 51, 35);
            row("PERMISO SCT:", data.permisoSCT || "", 88, 45);
            row("TIPO PERMISO:", data.tipoPermiso || "", 135, 60);
            y += 8;
            row("UNIDAD:", data.unitId || "", 14, 32);
            row("MARCA/MOD:", data.brandModel || "", 48, 38);
            row("PLACAS:", data.plates || "", 88, 32);
            row("CONFIG:", data.mode || "", 122, 25);
            row("VIN:", data.vin || "", 149, 46);
            y += 8;
            row("OPERADOR:", (data.driverName || "") + (data.employeeNumber ? ` (No. ${data.employeeNumber})` : ""), 14, 181);
            y += 8;
            row("LICENCIA:", data.license || "", 14, 60);
            row("VIG. LICENCIA:", data.licenseExp || "", 76, 60);
            row("TIPO DE CARGA:", data.tipoCarga || "", 138, 57);
            y += 8;
            row("ORIGEN:", data.origin || "", 14, 60);
            row("DESTINO:", data.destination || "", 76, 60);
            row("KM INICIO:", data.kmInicio || "", 138, 28);
            row("KM FIN:", data.kmFin || "", 168, 27);
            y += 8;

            // PUNTOS INTERMEDIOS Y HORAS DE SALIDA Y LLEGADA
            const puntos = data.puntosIntermedios || data.puntos_intermedios || "Directo por carretera federal";
            row("PUNTOS INTERMEDIOS / RUTA:", puntos, 14, 181);
            y += 8;
            row("HORA SALIDA:", data.horaSalida || data.hora_salida || "No registrada", 14, 90);
            row("HORA LLEGADA (ESTIMADA/REAL):", data.horaLlegada || data.hora_llegada || "En ruta", 106, 89);
            y += 8;

            const coCond = data.coConductor;
            if (coCond && String(coCond).trim()) {
                row("CO-CONDUCTOR:", coCond, 14, 92);
                row("LIC. CO-COND:", data.coLicencia || "", 108, 87);
                y += 8;
            }
            y += 2;

            const drawLegalGrid = (startY, label, dayLogs, isDay2) => {
                doc.setFillColor(230); doc.rect(14, startY, 181, 5, 'F');
                doc.setTextColor(0); doc.setFont("helvetica", "bold"); doc.text(label, 105, startY + 3.5, { align: "center" });

                const gx = 20; const gy = startY + 8; const gw = 175; const gh = 28; const rowH = gh / 5;
                const statusLabels = ["CONDUCIENDO", "PAUSA", "AUXILIAR", "EXCEPCIÓN", "DESCANSO"];

                doc.setFontSize(5); doc.setDrawColor(150); doc.setLineWidth(0.1);
                statusLabels.forEach((s, i) => {
                    doc.text(s, 19, gy + (i * rowH) + (rowH / 2), { align: "right" });
                    doc.line(gx, gy + (i * rowH), gx + gw, gy + (i * rowH));
                });
                doc.line(gx, gy + gh, gx + gw, gy + gh);

                for (let i = 0; i <= 24; i++) {
                    let x = gx + (gw / 24) * i;
                    doc.line(x, gy, x, gy + gh);
                    if (i % 2 === 0) {
                        const rawHour = (shiftStart + i) % 24;
                        doc.text(rawHour.toString().padStart(2, "0"), x, gy - 2, { align: "center" });
                    }
                }
                doc.rect(gx, gy, gw, gh);

                if (dayLogs && dayLogs.length > 0) {
                    doc.setDrawColor(...azulOficial); doc.setLineWidth(0.7);
                    const mapSt = { 3: 0, 2: 1, 4: 2, 5: 3, 1: 4 };

                    dayLogs.forEach((l, i) => {
                        const status = getActivityStatus(l);
                        const rIdx = mapSt[status];
                        if (rIdx === undefined) return;

                        let ds = new Date(l.startTime);
                        let de = l.endTime ? new Date(l.endTime) : new Date();

                        let h1 = (ds.getHours() + ds.getMinutes() / 60 - shiftStart + 24) % 24;
                        let h2 = (de.getHours() + de.getMinutes() / 60 - shiftStart + 24) % 24;

                        let x1 = gx + (gw / 24) * h1;
                        let x2 = gx + (gw / 24) * h2;

                        const cruzaLimiteTurno = (de > ds) && (x2 < x1);
                        let yLine = gy + (rIdx * rowH) + (rowH / 2);

                        if (cruzaLimiteTurno) {
                            if (!isDay2) {
                                doc.line(x1, yLine, gx + gw, yLine);
                            } else {
                                doc.line(gx, yLine, x2, yLine);
                            }
                        } else {
                            doc.line(x1, yLine, x2, yLine);
                        }

                        // Conexión vertical ortogonal con estado anterior
                        if (i > 0) {
                            let prev = dayLogs[i - 1];
                            const prevStatus = getActivityStatus(prev);
                            const prevR = mapSt[prevStatus];
                            if (prevR !== undefined) {
                                let prevY = gy + (prevR * rowH) + (rowH / 2);
                                let prevEnd = new Date(prev.endTime);
                                let hPrevEnd = (prevEnd.getHours() + prevEnd.getMinutes() / 60 - shiftStart + 24) % 24;
                                let xPrevEnd = gx + (gw / 24) * hPrevEnd;
                                if (Math.abs(x1 - xPrevEnd) < 2) {
                                    doc.line(x1, prevY, x1, yLine);
                                }
                            }
                        }
                    });
                }
            };

            drawLegalGrid(y, "DÍA 1 (PRIMERAS 24 HORAS)", logsD1, false);
            y += 42;
            drawLegalGrid(y, "DÍA 2 (CONTINUACIÓN DE VIAJE / 48 HORAS)", logsD2, true);
            y += 42;

            // Tabla de Desglose
            doc.setFontSize(9); doc.setTextColor(...naranja); doc.setFont("helvetica", "bold");
            doc.text("DESGLOSE CRONOLÓGICO DE ACTIVIDADES", 14, y);
            y += 4;

            doc.setFillColor(220); doc.rect(14, y, 181, 5, 'F');
            doc.setTextColor(0); doc.setFontSize(6);
            doc.text("HORA INICIO", 16, y + 3.5); doc.text("HORA FIN", 42, y + 3.5);
            doc.text("ACTIVIDAD", 66, y + 3.5); doc.text("DURACIÓN", 96, y + 3.5);
            doc.text("GPS", 121, y + 3.5); doc.text("OBSERVACIONES / LUGAR", 151, y + 3.5);
            y += 5;

            doc.setFont("helvetica", "normal");
            logs.forEach((l, idx) => {
                if (y > 250) {
                    doc.addPage();
                    y = 20;
                    doc.setFillColor(220); doc.rect(14, y, 181, 5, 'F');
                    doc.setTextColor(0); doc.setFontSize(6);
                    doc.text("HORA INICIO", 16, y + 3.5); doc.text("HORA FIN", 42, y + 3.5);
                    doc.text("ACTIVIDAD", 66, y + 3.5); doc.text("DURACIÓN", 96, y + 3.5);
                    doc.text("GPS", 121, y + 3.5); doc.text("OBSERVACIONES / LUGAR", 151, y + 3.5);
                    y += 5;
                    doc.setFont("helvetica", "normal");
                }

                // Homologado: AUXILIAR en lugar de SERVICIO
                const stName = ["", "DESCANSO", "PAUSA", "CONDUCIENDO", "AUXILIAR", "EXCEPCIÓN"][getActivityStatus(l)] || "OTRO";
                const s = new Date(l.startTime);
                const e = l.endTime ? new Date(l.endTime) : new Date();
                const dur = Math.floor((e - s) / 60000);
                const durStr = `${Math.floor(dur / 60)}h ${dur % 60}m`;

                if (idx % 2 === 0) { doc.setFillColor(250); doc.rect(14, y, 181, 4, 'F'); }

                doc.text(s.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 16, y + 3);
                doc.text(e.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 42, y + 3);
                doc.text(stName, 66, y + 3);
                doc.text(durStr, 96, y + 3);
                doc.text(formatGps(l.gps).substring(0, 26), 121, y + 3);
                doc.text(([l.place, l.observation].filter(Boolean).join(' / ') || "-").substring(0, 28), 151, y + 3);

                y += 4;
            });

            // Firmas con detección de formato
            if (y > 220) { doc.addPage(); y = 30; }
            y += 10;

            doc.setDrawColor(0);
            doc.line(30, y + 20, 80, y + 20);
            insertarFirmaSegura(doc, data.signatureOp, 35, y, 40, 18);
            doc.setFontSize(7); doc.text("FIRMA CONDUCTOR", 55, y + 23, { align: "center" });
            doc.setFontSize(5); doc.text(data.driverName || "", 55, y + 26, { align: "center" });
            doc.text("Lic. Federal: " + (data.license || ""), 55, y + 29, { align: "center" });

            doc.line(120, y + 20, 170, y + 20);
            insertarFirmaSegura(doc, data.signatureSup, 125, y, 40, 18);
            doc.setFontSize(7); doc.text("FIRMA SUPERVISOR / DESPACHADOR", 145, y + 23, { align: "center" });

            // Declaratoria bajo protesta
            y += 33;
            doc.setFontSize(5); doc.setTextColor(0);
            doc.setFont("helvetica", "bold");
            doc.text("DECLARATORIA BAJO PROTESTA DE DECIR VERDAD", 105, y, { align: "center" });
            doc.setFont("helvetica", "normal");
            y += 3.5;
            const declaratoria = doc.splitTextToSize(
                "El conductor y el permisionario que suscriben la presente bitácora DECLARAN BAJO PROTESTA DE DECIR VERDAD que los datos, tiempos de conducción, " +
                "pausas, descansos, itinerario y registros son fidedignos y reflejan sus actividades reales durante el periodo comprendido, en estricto " +
                "cumplimiento con la Norma Oficial Mexicana NOM-087-SCT-2-2017 y las leyes federales de autotransporte. " +
                "Esta bitácora se conservará por un periodo mínimo legal de 30 días naturales.", 180);
            doc.text(declaratoria, 105, y, { align: "center" });
            y += declaratoria.length * 3 + 2;

            doc.setFontSize(4); doc.setTextColor(120);
            doc.text("GRUPO BACHOCO, S.A. DE C.V. — Permisionario de Autotransporte Federal — Folio: " + folio + " — " + new Date().toISOString(), 105, y + 2, { align: "center" });

            // Página 2: Resumen legal NOM-087
            doc.addPage();
            doc.setFillColor(...naranja); doc.rect(0, 0, 210, 15, 'F');
            doc.setTextColor(255); doc.setFontSize(11); doc.setFont("helvetica", "bold");
            doc.text("RESUMEN DE OBLIGACIONES LEGALES — NOM-087-SCT-2-2017", 105, 10, { align: "center" });

            doc.setTextColor(0); doc.setFontSize(7);
            let ry = 22;

            doc.setFont("helvetica", "bold"); doc.setFontSize(8);
            doc.text("TIEMPOS MÁXIMOS DE CONDUCCIÓN Y PAUSAS OBLIGATORIAS", 14, ry);
            ry += 5;

            doc.setFontSize(7); doc.setFont("helvetica", "normal");
            const rules = [
                "4.1 TIEMPO MÁXIMO DE CONDUCCIÓN CONTINUA: Máximo 5 horas continuas de conducción, tras las cuales se debe tomar una pausa de al menos 30 minutos ininterrumpidos.",
                "4.2 PAUSAS NO FRACCIONABLES: Las pausas obligatorias de 30 minutos no se pueden fraccionar ni acumular.",
                "4.3 TIEMPO MÁXIMO DE CONDUCCIÓN EN 24 HORAS: El tiempo total no excederá de 14 horas en un periodo de 24 horas.",
                "4.4 DESCANSO OBLIGATORIO: Al completar la jornada de 14 horas o al término de la jornada, descanso mínimo de 8 horas continuas.",
                "4.5 ITINERARIO Y PUNTOS INTERMEDIOS: El conductor debe asentar la ruta, escalas intermedias y horas de salida y llegada para validación de la autoridad federal.",
                "4.6 CO-CONDUCTOR: En relevo, cada conductor llevará su propia bitácora individual. El tiempo de copiloto no sustituye el descanso de 8 horas.",
                "4.7 EXCEPCIONES: La conducción solo se prolongará por fuerza mayor justificada y anotada textualmente en la bitácora.",
                "4.8 PORTABILIDAD DE LA BITÁCORA: Deberá portarse en la unidad física o digitalmente para inspección de la Guardia Nacional / SCT en todo momento."
            ];
            rules.forEach(r => {
                const split = doc.splitTextToSize(r, 180);
                doc.text(split, 14, ry);
                ry += (split.length * 3.5) + 3;
            });

            doc._docTipo = 'bitacora';
            return doc;
        }

        // ===================================================================
        //  CHECK LIST DE REVISIÓN DIARIA (Se mantiene íntegro)
        // ===================================================================
        function generarPDFChecklist(data) {
            if (!window.jspdf) { showError("Librería PDF no disponible."); return null; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            const folio = data.folio || 'S/F';
            const u = data.unitId || '-';
            const opNombre = data.driverName || '-';
            const numeroEmpleado = data.employeeNumber || data.numeroEmpleado || '';
            const t1 = data.tolva1 || 'S/N';
            const t2 = data.tolva2 || 'S/N';
            const dolly = data.dolly || 'S/N';
            const km = data.km || '-';
            const origen = data.origen || '-';
            const destino = data.destino || '-';
            const fecha = data.fecha || new Date().toLocaleDateString('es-MX');
            const hora = data.hora || new Date().toLocaleTimeString('es-MX');
            const nombreOp2 = data.operador2 || '';
            const nombreSup = data.supervisor || '';

            const firmaOpImg = data.firmaOp || '';
            const firmaOp2Img = data.firmaOp2 || '';
            const firmaSupImg = data.firmaSup || '';

            const secciones = Array.isArray(data.checklistData) ? data.checklistData : [];

            const pageW = 210;
            const margin = 14;
            const contentW = pageW - margin * 2;
            const NUM_COLS = 3;
            const COL_GAP = 4;
            const colW = (contentW - COL_GAP * (NUM_COLS - 1)) / NUM_COLS;

            secciones.forEach((sec, pageIndex) => {
                if (pageIndex > 0) doc.addPage();

                let y = 13;

                doc.setFillColor(234, 88, 12);
                doc.rect(margin, y, contentW, 11, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(13);
                doc.text('REPORTE DE INSPECCIÓN', margin + 3, y + 7.5);
                doc.setFontSize(7.5);
                doc.text('FECHA: ' + fecha + '   HORA: ' + hora, pageW - margin - 2, y + 4.5, { align: 'right' });
                doc.text('FOLIO: ' + folio, pageW - margin - 2, y + 9, { align: 'right' });

                doc.setTextColor(100, 100, 100);

                doc.setFontSize(8);

                y += 5;

                doc.setFillColor(248, 250, 252);
                doc.setDrawColor(226, 232, 240);
                doc.setLineWidth(0.3);
                doc.rect(margin, y, contentW, 22, 'FD');
                doc.setTextColor(0, 0, 0);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(8);
                const half = contentW / 2;
                const empleadoTexto = numeroEmpleado ? '   No. EMP: ' + numeroEmpleado : '';
                doc.text('UNIDAD: ' + u, margin + 3, y + 5);
                doc.text('OPERADOR: ' + opNombre + empleadoTexto, margin + half + 3, y + 5);
                doc.text('TOLVA 1: ' + t1, margin + 3, y + 11);
                doc.text('TOLVA 2: ' + t2, margin + half + 3, y + 11);
                doc.text('DOLLY: ' + dolly, margin + 3, y + 17);
                doc.text('KM: ' + km, margin + half + 3, y + 17);
                doc.text('ORIGEN: ' + origen + '   DESTINO: ' + destino, margin + 3, y + 21);

                y += 26;

                doc.setFillColor(51, 65, 85);
                doc.rect(margin, y, contentW, 8, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(11);
                doc.text(sec.titulo || '', margin + 3, y + 5.5);

                y += 12;

                const COL_HEIGHT = 170;
                const CAT_BOX_H = 5.5;
                const CAT_INCREMENT = 6.5;
                const ITEM_INCREMENT = 6;
                const ITEM_LINE_HEIGHT = 3.1;
                const MIN_OBS_H = 12;
                const OBS_TOP_PADDING = 8;
                const OBS_LINE_HEIGHT = 4;

                const COL_START_Y = y;
                const COL_BOTTOM = COL_START_Y + COL_HEIGHT;
                const OBS_Y = COL_BOTTOM + 3;
                const MAX_OBS_H = 18;
                const SIG_Y = OBS_Y + MAX_OBS_H + 2;
                const colXStart = [
                    margin,
                    margin + colW + COL_GAP,
                    margin + (colW + COL_GAP) * 2
                ];

                let col = 0;

                (sec.categorias || []).forEach(cat => {
                    if (col < NUM_COLS - 1 && y + CAT_INCREMENT + ITEM_INCREMENT > COL_BOTTOM) {
                        col++;
                        y = COL_START_Y;
                    }
                    const cx = colXStart[col];

                    doc.setFillColor(241, 245, 249);
                    doc.setDrawColor(234, 88, 12);
                    doc.setLineWidth(0.4);
                    doc.rect(cx, y, colW, CAT_BOX_H, 'FD');
                    doc.setFillColor(234, 88, 12);
                    doc.rect(cx, y, 1.5, CAT_BOX_H, 'F');
                    doc.setTextColor(51, 65, 85);
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(7);
                    doc.text(cat.cat || '', cx + 5, y + 3.8);

                    y += CAT_INCREMENT;

                    (cat.items || []).forEach(entry => {
                        const itemText = entry.item || '';
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(6.5);
                        const itemLines = doc.splitTextToSize(itemText, colW - 17);
                        const itemHeight = Math.max(ITEM_INCREMENT, 2.5 + itemLines.length * ITEM_LINE_HEIGHT);

                        if (col < NUM_COLS - 1 && y + itemHeight > COL_BOTTOM) {
                            col++;
                            y = COL_START_Y;
                        }
                        const cxItem = colXStart[col];
                        const cxRight = cxItem + colW;

                        doc.setFillColor(255, 255, 255);
                        doc.setDrawColor(238, 238, 238);
                        doc.setLineWidth(0.15);
                        doc.rect(cxItem, y - 3, colW, itemHeight - 0.5, 'FD');

                        doc.setTextColor(50, 50, 50);
                        doc.text(itemLines, cxItem + 3, y + 0.2);

                        const v = entry.estado;
                        if (v === 'OK') {
                            doc.setTextColor(22, 163, 74);
                            doc.setFont('helvetica', 'bold');
                            doc.text('OK', cxRight - 2, y + 0.5, { align: 'right' });
                        } else if (v === 'MAL') {
                            doc.setFillColor(220, 38, 38);
                            doc.roundedRect(cxRight - 11, y - 2.5, 9, 5, 1, 1, 'F');
                            doc.setTextColor(255, 255, 255);
                            doc.setFont('helvetica', 'bold');
                            doc.text('MAL', cxRight - 6.5, y + 0.5, { align: 'center' });
                        } else {
                            doc.setTextColor(180, 180, 180);
                            doc.setFont('helvetica', 'normal');
                            doc.text('-', cxRight - 2, y + 0.5, { align: 'right' });
                        }

                        y += itemHeight;
                    });

                    y += 2;
                });

                const obsTexto = sec.observacion || 'Sin observaciones';
                const obsLines = doc.splitTextToSize(obsTexto, contentW - 10);
                const obsH = Math.min(MAX_OBS_H, Math.max(MIN_OBS_H, OBS_TOP_PADDING + obsLines.length * OBS_LINE_HEIGHT));
                doc.setFillColor(255, 247, 237);
                doc.setDrawColor(253, 186, 116);
                doc.setLineWidth(0.3);
                doc.rect(margin, OBS_Y, contentW, obsH, 'FD');
                doc.setTextColor(154, 52, 18);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(7.5);
                doc.text('NOTAS ' + (sec.titulo || '') + ':', margin + 3, OBS_Y + 5);
                doc.setFont('helvetica', 'normal');
                doc.text(obsLines, margin + 3, OBS_Y + 10);

                {
                    const sigW = (contentW - 8) / 3;
                    const sigBoxes = [
                        { img: firmaOpImg, nombre: opNombre, cargo: 'FIRMA OPERADOR', x: margin },
                        { img: firmaOp2Img, nombre: nombreOp2 || 'N/A', cargo: 'FIRMA OPERADOR 2', x: margin + sigW + 4 },
                        { img: firmaSupImg, nombre: nombreSup || 'N/A', cargo: 'FIRMA SUPERVISOR', x: margin + (sigW + 4) * 2 }
                    ];
                    sigBoxes.forEach(sig => {
                        insertarFirmaSegura(doc, sig.img, sig.x, SIG_Y, sigW, 18);
                        doc.setDrawColor(100, 100, 100);
                        doc.setLineWidth(0.5);
                        doc.line(sig.x, SIG_Y + 20, sig.x + sigW, SIG_Y + 20);
                        doc.setTextColor(0, 0, 0);
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(7.5);
                        doc.text(sig.nombre, sig.x + sigW / 2, SIG_Y + 25, { align: 'center' });
                        doc.setTextColor(100, 100, 100);
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(7);
                        doc.text(sig.cargo, sig.x + sigW / 2, SIG_Y + 29, { align: 'center' });
                    });
                }
            });

            if (secciones.length === 0) {
                doc.setFontSize(12); doc.setTextColor(0);
                doc.text('Checklist sin detalle disponible para el folio ' + folio + '.', 14, 20);
            }

            doc._docTipo = 'checklist';
            return doc;
        }

        function generarPDF(data) {
            return detectarTipo(data) === 'checklist'
                ? generarPDFChecklist(data)
                : generarPDFBitacora(data);
        }

        function descargarPDF() {
            if (!pdfDoc) return;
            const folio = pdfDoc._bitacoraFolio || "PDF";
            const prefijo = pdfDoc._docTipo === 'checklist' ? 'Checklist' : 'Bitacora';
            pdfDoc.save(`${prefijo}_${folio.replace(/[\\/]/g, '-')}.pdf`);
        }

        const firebaseConfig = {
            apiKey: "__FIREBASE_API_KEY__",
            authDomain: "gen-lang-client-0015118308.firebaseapp.com",
            projectId: "gen-lang-client-0015118308",
            storageBucket: "gen-lang-client-0015118308.firebasestorage.app",
            messagingSenderId: "228375512926",
            appId: "1:228375512926:web:201c4c4b4dec7ae7fdb1cf",
            measurementId: "G-SK8TYXT3JD"
        };

        async function obtenerReporteFirestore(id) {
            if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("__")) {
                throw new Error("La configuración de Firebase no está disponible.");
            }

            const firebaseSdk = await import("./js/firebase-sdk.js");
            const { initializeApp } = firebaseSdk;
            const { getAuth, signInAnonymously } = firebaseSdk;
            const { getFirestore, doc, getDoc } = firebaseSdk;
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            if (!auth.currentUser) await signInAnonymously(auth);

            const db = getFirestore(app);
            const snapshot = await getDoc(doc(db, "bitacora_reports", id));
            if (!snapshot.exists()) return null;

            const stored = snapshot.data();
            const payload = stored.payload && typeof stored.payload === "object" ? stored.payload : stored;
            return {
                ...payload,
                folio: stored.folio || payload.folio,
                reportType: stored.report_type || payload.reportType || payload.tipo,
                unitId: stored.unit_id || payload.unitId,
                driverName: stored.driver_name || payload.driverName,
                employeeNumber: stored.employee_number || payload.employeeNumber,
                puntosIntermedios: stored.puntos_intermedios || payload.puntosIntermedios || payload.puntos_intermedios || "",
                horaSalida: stored.hora_salida || payload.horaSalida || payload.hora_salida || "",
                horaLlegada: stored.hora_llegada || payload.horaLlegada || payload.hora_llegada || ""
            };
        }

        async function obtenerReporteNetlify(id) {
            const resp = await fetch(`/api/store-bitacora?id=${encodeURIComponent(id)}`);
            if (resp.ok) return resp.json();

            const errorData = await resp.json().catch(() => ({}));
            if (resp.status === 404) return null;
            throw new Error(errorData.error || `Error del servidor (${resp.status})`);
        }

        async function obtenerDatosReporte(id) {
            // Intento 1: Almacenamiento local (si el visor se abre en el mismo teléfono offline)
            try {
                const localKey = Object.keys(localStorage).find(k => k.includes(id));
                if (localKey) {
                    const localData = JSON.parse(localStorage.getItem(localKey));
                    if (localData) return localData.payload || localData;
                }
            } catch (e) {}

            let errorFirestore = null;
            try {
                const reporte = await obtenerReporteFirestore(id);
                if (reporte) return reporte;
            } catch (error) {
                errorFirestore = error;
                console.warn("No se pudo cargar desde Firestore, intentando Netlify:", error);
            }

            try {
                const reporte = await obtenerReporteNetlify(id);
                if (reporte) return reporte;
            } catch (errorNetlify) {
                if (errorFirestore) {
                    throw new Error(`Firestore: ${errorFirestore.message} | Netlify: ${errorNetlify.message}`);
                }
                throw errorNetlify;
            }

            return null;
        }

        async function cargarBitacora() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                showError("No se proporcionó un ID de reporte. Escanea el código QR de la unidad.");
                return;
            }

            try {
                const data = await obtenerDatosReporte(id);
                if (!data) {
                    showError("El reporte no fue encontrado en el servidor. Verifica que haya sido sincronizado.");
                    return;
                }
                const tipo = detectarTipo(data);

                if (tipo === 'checklist') {
                    document.title = 'Check List de Revisión Diaria | AppTolva';
                    document.getElementById('viewer-heading').textContent = '📋 Check List de Revisión Diaria';
                } else {
                    document.title = 'Bitácora NOM-087 | AppTolva';
                    document.getElementById('viewer-heading').textContent = '📋 Bitácora Oficial NOM-087';
                }

                setStatus("Generando documento oficial…", "Construyendo el PDF para exhibición, un momento…", false);

                await new Promise(r => setTimeout(r, 100));

                pdfDoc = generarPDF(data);
                if (!pdfDoc) return;
                pdfDoc._bitacoraFolio = data.folio || "PDF";

                const pdfDataUri = pdfDoc.output('datauristring');

                document.getElementById('status-box').style.display = 'none';
                document.getElementById('viewer-info').style.display = 'block';

                const frame = document.getElementById('pdf-frame');
                frame.src = pdfDataUri;
                frame.style.display = 'block';

                frame.onerror = () => showDownloadFallback();
                setTimeout(() => {
                    try {
                        if (frame.contentDocument && frame.contentDocument.body &&
                            frame.contentDocument.body.innerHTML === '') {
                            showDownloadFallback();
                        }
                    } catch (e) {
                        showDownloadFallback();
                    }
                }, 2000);

            } catch (err) {
                showError("No se pudo cargar el reporte: " + err.message);
            }
        }

        function showDownloadFallback() {
            document.getElementById('status-box').style.display = 'block';
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status-title').textContent = '✅ Documento Listo';
            document.getElementById('status-title').style.color = '#16a34a';
            document.getElementById('status-msg').textContent = 'Tu navegador no admite visualización directa en pantalla. Descarga el archivo para revisarlo.';
            document.getElementById('download-btn').style.display = 'block';
            document.getElementById('pdf-frame').style.display = 'none';
            document.getElementById('viewer-info').style.display = 'none';
        }

        window.descargarPDF = descargarPDF;
        cargarBitacora();
    </script>
