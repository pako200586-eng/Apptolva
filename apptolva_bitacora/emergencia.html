<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="./js/firebase-config.js"></script>
    <script src="./js/firebase-config-runtime.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dc2626">
    <title>Reportar emergencia | AppTolva</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="stylesheet" href="./css/fontawesome.min.css">
    <script src="./js/tailwindcss.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="bg-red-600 text-white p-4 sticky top-0 z-10 shadow flex items-center gap-3">
        <a href="index.html" aria-label="Volver al menú" class="text-white text-2xl"><i class="fas fa-arrow-left"></i></a>
        <div>
            <h1 class="font-black text-lg leading-tight">Reportar falla / emergencia</h1>
            <p class="text-xs text-red-100">Emergencia en ruta</p>
        </div>
    </header>

    <main class="p-4 max-w-lg mx-auto">
        <section class="bg-red-50 p-5 rounded-xl border border-red-200 shadow-sm">
            <h2 class="font-bold text-xl text-red-700 mb-4"><i class="fas fa-exclamation-triangle mr-2"></i>Registrar falla</h2>
            <label for="fallaContact" class="block text-xs font-bold text-slate-700 mb-1">Contacto de WhatsApp</label>
            <select id="fallaContact" class="w-full p-3 border border-gray-300 rounded mb-3 bg-white font-bold text-sm">
                <option value="5219211098696">LOGÍSTICA / MONITOREO (24H)</option>
                <option value="5219212683079">MANTENIMIENTO</option>
                <option value="5219212682626">TURNO A: F. Ambrosio</option>
                <option value="5219212656411">TURNO B: Omar</option>
                <option value="5219211230242">JEFE TRANSPORTE (Ing. B)</option>
            </select>
            <label for="fallaOperador" class="block text-xs font-bold text-slate-700 mb-1">Nombre del operador</label>
            <input id="fallaOperador" maxlength="200" class="w-full p-3 border border-gray-300 rounded mb-3 text-base font-bold uppercase" placeholder="NOMBRE DEL OPERADOR" autocomplete="off">
            <label for="fallaUnidad" class="block text-xs font-bold text-slate-700 mb-1">Número de unidad (tracto)</label>
            <input id="fallaUnidad" maxlength="100" class="w-full p-3 border border-gray-300 rounded mb-3 text-base font-bold uppercase" placeholder="NO. DE UNIDAD" autocomplete="off">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label for="fallaTolva1" class="block text-xs font-bold text-slate-700 mb-1">Tolva 1</label>
                    <input id="fallaTolva1" maxlength="100" class="w-full p-3 border border-gray-300 rounded text-base font-bold uppercase" placeholder="TOLVA 1" autocomplete="off">
                </div>
                <div>
                    <label for="fallaDolly" class="block text-xs font-bold text-slate-700 mb-1">Dolly</label>
                    <input id="fallaDolly" maxlength="100" class="w-full p-3 border border-gray-300 rounded text-base font-bold uppercase" placeholder="DOLLY" autocomplete="off">
                </div>
                <div>
                    <label for="fallaTolva2" class="block text-xs font-bold text-slate-700 mb-1">Tolva 2</label>
                    <input id="fallaTolva2" maxlength="100" class="w-full p-3 border border-gray-300 rounded text-base font-bold uppercase" placeholder="TOLVA 2" autocomplete="off">
                </div>
                <div>
                    <label for="fallaKm" class="block text-xs font-bold text-slate-700 mb-1">Kilometraje</label>
                    <input id="fallaKm" type="text" inputmode="numeric" maxlength="30" class="w-full p-3 border border-gray-300 rounded text-base font-bold" placeholder="KILOMETRAJE" autocomplete="off">
                </div>
            </div>
            <textarea id="fallaDesc" maxlength="4000" aria-label="Descripción de la falla" class="w-full p-4 border border-gray-300 rounded mb-3 text-sm" rows="4" placeholder="Describe la falla..."></textarea>
            <label class="mb-3 w-full flex flex-col items-center justify-center border-2 border-dashed border-red-300 rounded-lg p-4 bg-white cursor-pointer">
                <i class="fas fa-camera text-2xl text-red-500 mb-1"></i>
                <span id="fallaFotoLabel" class="text-xs font-bold text-gray-600">TOMAR FOTO DE EVIDENCIA</span>
                <input type="file" id="fallaFotoInput" accept="image/*" capture="environment" class="hidden" onchange="onFallaFotoSeleccionada(event)">
            </label>
            <img id="fallaFotoPreview" class="hidden w-full mb-3 rounded-lg border max-h-48 object-cover" alt="Vista previa de evidencia">
            <p id="fallaGpsStatus" role="status" class="text-sm text-gray-700 mb-2 text-center">Obteniendo ubicación...</p>
            <button type="button" onclick="iniciarCapturaFalla()" class="w-full mb-3 p-3 rounded border border-gray-400 bg-white text-gray-800 font-bold">Actualizar ubicación</button>
            <button type="button" onclick="registrarEmergenciaEnSistema()" id="btnRegistrarEmergencia" disabled class="w-full bg-red-600 text-white font-bold py-3 rounded shadow active:scale-95 disabled:opacity-50"><i class="fab fa-whatsapp mr-1"></i> REGISTRAR Y AVISAR POR WHATSAPP</button>
            <p id="fallaSaveStatus" role="status" aria-live="polite" class="text-center text-xs font-bold mt-3 p-2 rounded">Comprobando sesión...</p>
            <a id="fallaWhatsappEnlace" target="_blank" rel="noopener noreferrer" class="hidden block w-full mt-3 bg-green-700 text-white text-center font-bold py-3 rounded">ABRIR WHATSAPP SI NO SE ABRIÓ</a>
            <p id="fallaWhatsappInfo" class="hidden text-center text-xs text-slate-700 mt-2">Confirma el envío en WhatsApp. Si tomaste una foto, adjúntala allí manualmente.</p>
        </section>
    </main>

<script>
let fallaFotoBase64 = null;
let fallaUbicacion = null;
let solicitudUbicacion = 0;
const MAX_EDAD_UBICACION_MS = 2 * 60 * 1000;
window.limpiarFotoEmergencia = () => { fallaFotoBase64 = null; };

function iniciarCapturaFalla() {
    const status = document.getElementById('fallaGpsStatus');
    const solicitud = ++solicitudUbicacion;
    fallaUbicacion = null;
    if (!navigator.geolocation) {
        status.textContent = 'Ubicación no disponible en este dispositivo. Puedes avisar sin ella.';
        return;
    }
    status.textContent = 'Obteniendo ubicación. Puedes registrar y avisar sin esperar.';
    navigator.geolocation.getCurrentPosition((position) => {
        if (solicitud !== solicitudUbicacion) return;
        const { latitude, longitude, accuracy } = position.coords;
        const timestamp = position.timestamp;
        if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90 ||
            !Number.isFinite(longitude) || longitude < -180 || longitude > 180 ||
            !Number.isFinite(accuracy) || accuracy < 0 ||
            !Number.isFinite(timestamp) || timestamp > Date.now() ||
            Date.now() - timestamp > MAX_EDAD_UBICACION_MS) {
            status.textContent = 'Ubicación no disponible o antigua. Actualízala o avisa sin ella.';
            return;
        }
        fallaUbicacion = {
            lat: latitude,
            lng: longitude,
            accuracy,
            capturedAt: new Date(timestamp).toISOString()
        };
        status.textContent = `Ubicación aproximada (precisión estimada: ${Math.ceil(accuracy)} m). Actualízala si es inexacta.`;
    }, (error) => {
        if (solicitud !== solicitudUbicacion) return;
        console.warn('No se pudo obtener la ubicación:', error.message);
        status.textContent = error.code === 1
            ? 'Permiso de ubicación denegado. Puedes activarlo en el navegador o avisar sin ubicación.'
            : 'No se pudo obtener la ubicación. Intenta actualizarla o avisa sin ella.';
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

function comprimirImagen(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        const image = new Image();
        reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
        image.onerror = () => reject(new Error('No se pudo decodificar la imagen'));
        reader.onload = (event) => { image.src = event.target.result; };
        image.onload = () => {
            const scale = Math.min(1, 1280 / image.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
        };
        reader.readAsDataURL(file);
    });
}

function onFallaFotoSeleccionada(event) {
    const file = event.target.files[0];
    if (!file) return;
    comprimirImagen(file).then((base64) => {
        fallaFotoBase64 = base64;
        const preview = document.getElementById('fallaFotoPreview');
        preview.src = `data:image/jpeg;base64,${base64}`;
        preview.classList.remove('hidden');
        document.getElementById('fallaFotoLabel').textContent = 'FOTO LISTA — toca para cambiarla';
    }).catch((error) => alert(`No se pudo procesar la foto: ${error.message}`));
}

function construirPayload() {
    const operador = document.getElementById('fallaOperador').value.trim().toUpperCase();
    const unidad = document.getElementById('fallaUnidad').value.trim().toUpperCase();
    const tolva1 = document.getElementById('fallaTolva1').value.trim().toUpperCase();
    const dolly = document.getElementById('fallaDolly').value.trim().toUpperCase();
    const tolva2 = document.getElementById('fallaTolva2').value.trim().toUpperCase();
    const km = document.getElementById('fallaKm').value.trim();
    const descripcion = document.getElementById('fallaDesc').value.trim();
    const edad = fallaUbicacion ? Date.now() - Date.parse(fallaUbicacion.capturedAt) : NaN;
    if (fallaUbicacion && (!Number.isFinite(edad) || edad < 0 || edad > MAX_EDAD_UBICACION_MS)) {
        fallaUbicacion = null;
        document.getElementById('fallaGpsStatus').textContent = 'La ubicación era antigua y no se enviará. Actualízala si necesitas incluirla.';
    }
    return {
        tipo: 'emergencia',
        operador, unidad, tolva1, dolly, tolva2, km, descripcion,
        lat: fallaUbicacion?.lat ?? null,
        lng: fallaUbicacion?.lng ?? null,
        latitud: fallaUbicacion?.lat ?? null,
        longitud: fallaUbicacion?.lng ?? null,
        precisionGps: fallaUbicacion?.accuracy ?? null,
        fechaGps: fallaUbicacion?.capturedAt ?? null,
        gps: fallaUbicacion ? { ...fallaUbicacion, source: 'device-geolocation' } : null,
        fotoBase64: fallaFotoBase64,
        fotos: fallaFotoBase64 ? [{ nombre: 'evidencia.jpg', mimeType: 'image/jpeg', data: `data:image/jpeg;base64,${fallaFotoBase64}` }] : [],
        fecha: new Date().toISOString()
    };
}

function textoFalla(payload = construirPayload()) {
    const location = payload.gps
        ? `\nUbicación aproximada (precisión estimada: ${Math.ceil(payload.gps.accuracy)} m): https://maps.google.com/?q=${payload.gps.lat},${payload.gps.lng}`
        : '\nUbicación no disponible; contactar al operador.';
    return `🚨 EMERGENCIA/FALLA\nUnidad: ${payload.unidad}\n${payload.descripcion}${location}`;
}
function abrirWhatsappFalla(payload) {
    const url = `https://wa.me/${document.getElementById('fallaContact').value}?text=${encodeURIComponent(textoFalla(payload))}`;
    const enlace = document.getElementById('fallaWhatsappEnlace');
    enlace.href = url;
    enlace.classList.remove('hidden');
    document.getElementById('fallaWhatsappInfo').classList.remove('hidden');
    try {
        window.open(url, '_blank', 'noopener,noreferrer');
    } catch (error) {
        console.error('No se pudo abrir WhatsApp:', error);
    }
}
iniciarCapturaFalla();
</script>
<script type="module" src="./js/emergencias.js"></script>
</body>
</html>
