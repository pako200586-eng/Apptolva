[build]
  command = "cd apptolva_bitacora && bash build.sh"
  publish = "apptolva_bitacora"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Las funciones deben ejecutarse en Node 22: firebase-admin carga jose (ESM) con require().
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  # The Firebase SDK and esbuild are build-time dependencies used to create the
  # locally cached browser bundle.
  NPM_FLAGS = "--include=dev"
  # Las configuraciones Firebase web son públicas por diseño y se embeben en el bundle.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_STAGING_CONFIG_JSON,FIREBASE_PRODUCTION_CONFIG_JSON"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/viewer"
  to = "/viewer.html"
  status = 200
