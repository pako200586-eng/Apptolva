[build]
  command = "cd apptolva_bitacora && bash build.sh"
  publish = "apptolva_bitacora"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/viewer"
  to = "/viewer.html"
  status = 200
