[build]
  command = "cd apptolva_bitacora && bash build.sh"
  publish = "apptolva_bitacora"
  functions = "netlify/functions"

[build.environment]
  # The Firebase SDK and esbuild are build-time dependencies used to create the
  # locally cached browser bundle.
  NPM_FLAGS = "--include=dev"
  # La API key web de Firebase es pública por diseño (va en el HTML); se omite del escaneo
  # de secretos para que el build no falle al inyectarla. El resto de variables sí se escanea.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_API_KEY"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/viewer"
  to = "/viewer.html"
  status = 200
