[build]
  command = "cd apptolva_bitacora && bash build.sh"
  publish = "apptolva_bitacora"
  functions = "netlify/functions"

[functions]
  # Empaqueta jose/jwks-rsa dentro de la función para evitar ERR_REQUIRE_ESM.
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # The Firebase SDK and esbuild are build-time dependencies used to create the
  # locally cached browser bundle.
  NPM_FLAGS = "--include=dev"
  # Las configuraciones Firebase web son públicas por diseño y se embeben en el bundle.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_STAGING_CONFIG_JSON,FIREBASE_PRODUCTION_CONFIG_JSON"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/viewer"
  to = "/viewer.html"
  status = 200
